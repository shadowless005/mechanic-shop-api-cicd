name: Mechanic Shop API CI/CD

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mechanic-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build dependency wheels
        run: python -m pip wheel --wheel-dir wheelhouse -r requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-wheels
          path: wheelhouse/
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: dependency-wheels
          path: wheelhouse/
      - name: Install built dependencies
        run: python -m pip install --no-index --find-links wheelhouse -r requirements.txt
      - name: Run tests
        run: python -m unittest discover tests

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Request Render deployment of tested commit
        env:
          SERVICE_ID: ${{ secrets.SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          test -n "$SERVICE_ID" || { echo "Missing SERVICE_ID secret"; exit 1; }
          test -n "$RENDER_API_KEY" || { echo "Missing RENDER_API_KEY secret"; exit 1; }
          curl --fail-with-body --show-error --silent --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            --data "{\"commitId\":\"$GITHUB_SHA\"}" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            --output render-deploy.json
          echo "Render accepted the deployment request. Verify completion in Render before presenting."
